<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef1eb">
    <title>Everyday Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="calculator.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-heading">
        <p class="eyebrow">FOUR-FUNCTION CALCULATOR</p>
        <h1>Everyday<br>calculator<span>.</span></h1>
      </header>

      <section class="calculator" aria-label="Calculator">
        <div class="calculator-bar">
          <span class="brand-mark" aria-hidden="true">+</span>
          <span class="calculator-name">CALCULATOR</span>
          <span class="ready-indicator"><span></span> READY</span>
        </div>

        <div class="screen" aria-label="Display">
          <p class="expression" id="expression" aria-live="polite">READY</p>
          <output class="display" id="display" aria-live="polite" aria-atomic="true">0</output>
        </div>

        <div class="keypad" aria-label="Calculator keys">
          <button class="key key-utility" type="button" data-action="clear" aria-label="Clear">AC</button>
          <button class="key key-utility" type="button" data-action="delete" aria-label="Delete last character">DEL</button>
          <button class="key key-operator" type="button" data-value="/" aria-label="Divide">÷</button>
          <button class="key key-operator" type="button" data-value="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-value="7">7</button>
          <button class="key" type="button" data-value="8">8</button>
          <button class="key" type="button" data-value="9">9</button>
          <button class="key key-operator" type="button" data-value="-" aria-label="Subtract">−</button>

          <button class="key" type="button" data-value="4">4</button>
          <button class="key" type="button" data-value="5">5</button>
          <button class="key" type="button" data-value="6">6</button>
          <button class="key key-operator" type="button" data-value="+" aria-label="Add">+</button>

          <button class="key" type="button" data-value="1">1</button>
          <button class="key" type="button" data-value="2">2</button>
          <button class="key" type="button" data-value="3">3</button>
          <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>

          <button class="key key-zero" type="button" data-value="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
        </div>

        <div class="calculator-footer">
          <span>EVERYDAY MATH</span>
          <span>calc</span>
        </div>
      </section>
    </main>
  </body>
</html>
